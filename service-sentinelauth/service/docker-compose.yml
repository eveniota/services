name: service-sentinelauth
services:
  sentinelauth:
    image: service-sentinelauth:latest
    container_name: service-sentinelauth
    ports:
      - "8002:8002"
    environment:
      - ADMIN_REGISTRATION_KEY=campus_dean_secret_authorization_key_2026
    volumes:
      - ./data:/data
      - ./app:/service/app
    restart: unless-stopped